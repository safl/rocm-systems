# amdgpu against a rocjitsu GPU: IP discovery from the file, no PSP, CPU page
# table updates, no recovery, and the six IP blocks rocjitsu models (common,
# gmc, ih, gfx, sdma, mes). Installed by rocjitsu-guest-firmware.
#
# vramlimit is the BAR of the server config rocjitsu-host ships, set when the
# package is built, so all of VRAM is CPU-visible. Otherwise pinning a buffer
# for a peer, as a dma-buf MR does, can move it into the BAR.
options amdgpu discovery=2 emu_mode=1 fw_load_type=0 vm_update_mode=3 gpu_recovery=0 vramlimit=VRAM_APERTURE_MIB ip_block_mask=0x3f
