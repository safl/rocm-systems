# The debs xNVMe's test images are assembled from: rocjitsu-host for the host,
# rocjitsu-guest-firmware for the guest, from one build, so the guest's
# ip_discovery.bin always describes the GPU the server presents. cijoe does
# the work, as emulation/rocjitsu/packaging/xnvme-ci/cijoe/workflows/
# packages.yaml, which runs the same way outside GitHub; this only runs it and
# keeps its report. A tag xnvme-ci/v<version>-<n> publishes the debs as a
# release.
#
# Copyright (c) Simon A. F. Lund <os@safl.dk>
# SPDX-License-Identifier: MIT
name: xnvme-ci

on:
  push:
    branches: ['xnvme-ci/**']
    tags: ['xnvme-ci/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  debs:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
    - run: apt-get -qy update && apt-get -qy install git pipx python3
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: |
          emulation/rocjitsu
          runtimes/api-headers
    - id: n
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" = tag ]; then
          base=$(sed -n 's/^project(rocm_jit_suite VERSION \([0-9.]*\)).*/\1/p' emulation/rocjitsu/CMakeLists.txt)
          tag=${REF_NAME#xnvme-ci/v}
          [ "${tag%-*}" = "$base" ] || { echo "::error::tag $REF_NAME is not for $base"; exit 1; }
          echo "n=${tag##*-}"
        else
          echo "n=0"
        fi >> "$GITHUB_OUTPUT"
    - name: cijoe, packages.yaml
      env:
        XNVME_CI_SRC: ${{ github.workspace }}
        XNVME_CI_OUT: ${{ github.workspace }}/out
        XNVME_CI_N: ${{ steps.n.outputs.n }}
      run: |
        pipx install --include-deps ./emulation/rocjitsu/packaging/xnvme-ci/cijoe
        cd emulation/rocjitsu/packaging/xnvme-ci/cijoe
        ~/.local/bin/cijoe workflows/packages.yaml --config configs/default.toml \
          --monitor --output "$GITHUB_WORKSPACE/cijoe-output"
    - uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: cijoe-report
        path: cijoe-output/report.html
        if-no-files-found: warn
    - uses: actions/upload-artifact@v6.0.0
      with:
        name: debs
        path: out/*.deb
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: debs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd debs
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "rocjitsu-host and rocjitsu-guest-firmware from $GITHUB_SHA." \
          *.deb SHA256SUMS
