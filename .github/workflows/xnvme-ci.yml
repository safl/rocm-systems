# The debs xNVMe's test images are assembled from: rocjitsu-host for the host,
# rocjitsu-guest-firmware for the guest, from one build, so the guest's
# ip_discovery.bin always describes the GPU the server presents. A tag
# xnvme-ci/v<version>-<n> publishes them as a release.
#
# Copyright (c) Simon A. F. Lund <os@safl.dk>
# SPDX-License-Identifier: MIT
name: xnvme-ci

on:
  push:
    branches: ['xnvme-ci/**']
    tags: ['xnvme-ci/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
    - run: apt-get -qy update && apt-get -qy install git
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: |
          emulation/rocjitsu
          runtimes/api-headers
    - name: Package version
      id: v
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        git config --global --add safe.directory "$PWD"
        base=$(sed -n 's/^project(rocm_jit_suite VERSION \([0-9.]*\)).*/\1/p' emulation/rocjitsu/CMakeLists.txt)
        [ -n "$base" ]
        if [ "$REF_TYPE" = tag ]; then
          tag=${REF_NAME#xnvme-ci/v}
          [ "${tag%-*}" = "$base" ] || { echo "::error::tag $REF_NAME is not for $base"; exit 1; }
          deb="$base+xnvme${tag##*-}"
        else
          deb="$base+xnvme0~g$(git rev-parse --short HEAD)"
        fi
        echo "deb=$deb" >> "$GITHUB_OUTPUT"
        echo "$deb"
    - run: bash emulation/rocjitsu/packaging/xnvme-ci/build-host.sh out "${{ steps.v.outputs.deb }}"
    - run: bash emulation/rocjitsu/packaging/xnvme-ci/build-firmware.sh out/rocjitsu-host_*.deb out
    - run: python3 -m unittest emulation/rocjitsu/tests/tools/test_vfio_guest_firmware.py
    - uses: actions/upload-artifact@v6.0.0
      with:
        name: debs
        path: out/*.deb
        if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
    - uses: actions/checkout@v6
      with:
        filter: blob:none
        sparse-checkout: emulation/rocjitsu/packaging
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - run: bash emulation/rocjitsu/packaging/xnvme-ci/test-packages.sh debs

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd debs
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "rocjitsu-host and rocjitsu-guest-firmware from $GITHUB_SHA." \
          *.deb SHA256SUMS
